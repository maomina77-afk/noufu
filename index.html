<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシートリーダー (安定版)V12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .qr-box-fixed { width: 100% !important; height: 90px !important; border: 3px solid #22c55e !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div id="app" class="max-w-md mx-auto">
        <h1 class="text-xl font-bold mb-4">レシート集計リーダーV12</h1>
        
        <!-- カメラ表示領域 -->
        <div id="camera-area" class="hidden mb-4">
            <div id="reader" class="w-full h-[300px] overflow-hidden bg-black rounded-lg"></div>
            <button onclick="stopScanner()" class="mt-2 w-full bg-red-600 text-white py-3 rounded">閉じる</button>
        </div>

        <!-- ボタン領域 -->
        <div id="main-menu" class="space-y-4">
            <button onclick="startScanner()" class="w-full bg-blue-600 text-white py-4 rounded font-bold">バーコードスキャン</button>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFile(event)">
            <button onclick="document.getElementById('file-input').click()" class="w-full bg-green-600 text-white py-4 rounded font-bold">OCR読み込み</button>
        </div>
    </div>

    <script>
        let html5QrCode = null;

        async function startScanner() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('camera-area').classList.remove('hidden');

            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 300, height: 90 } },
                    (decodedText) => {
                        alert("読み取り成功: " + decodedText);
                        stopScanner();
                    }
                );
            } catch (err) {
                alert("カメラ起動エラー: " + err);
                stopScanner();
            }
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('main-menu').classList.remove('hidden');
                    document.getElementById('camera-area').classList.add('hidden');
                }).catch(() => {
                    location.reload(); // 強制終了
                });
            } else {
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('camera-area').classList.add('hidden');
            }
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            alert("画像ファイルを選択しました。OCR処理を開始します...");
            // ここにOCR処理を記述
        }
    </script>
</body>
</html>
